name: Build NOVA KOKI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            novakoki
          sparse-checkout-cone-mode: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: novakoki
        run: flutter pub get

      - name: Build release APK
        working-directory: novakoki
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-KOKI-APK
          path: novakoki/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
